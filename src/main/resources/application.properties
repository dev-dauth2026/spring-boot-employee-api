spring.application.name=employeeapi

# =========================
# DATABASE (via ENV VARS)
# =========================
# These resolve from environment variables when you run the app.
# If not provided, they fall back to safe local defaults (no password).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/employee_db}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
# For development only \u2013 in real prod you would use 'validate' or migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# =========================
# SWAGGER / OPENAPI
# =========================
springdoc.swagger-ui.path=/swagger-ui/index.html
springdoc.api-docs.enabled=true
springdoc.remove-broken-reference-definitions=true
logging.level.org.springdoc=DEBUG

# =========================
# SECURITY (Keycloak / JWT)
# =========================
# Local default for your Keycloak dev realm.
# In real prod, override with env vars:
#   export OIDC_ISSUER_URI=...
spring.security.oauth2.resourceserver.jwt.issuer-uri=${OIDC_ISSUER_URI:http://localhost:8081/realms/employee-api}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${OIDC_JWK_URI:http://localhost:8081/realms/employee-api/protocol/openid-connect/certs}

# Audience that your access tokens must contain (used by AudienceValidator)
app.security.expected-audience=${APP_AUDIENCE:employeeapi}

# CORS (comma-separated). Override in prod with env var if needed.
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4200}